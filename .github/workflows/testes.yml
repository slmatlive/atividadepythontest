name: Testes automaticos do Flask

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Menor intervalo permitido pelo agendamento do GitHub Actions.
    - cron: '*/5 * * * *'

permissions:
  contents: read

jobs:
  testes:
    name: Testar a cada 30 segundos (10 rodadas)
    runs-on: ubuntu-latest
    timeout-minutes: 9

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Preparar Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validar sintaxe
        run: python -m compileall -q app.py tests

      - name: Executar testes a cada 30 segundos
        shell: bash
        run: |
          mkdir -p relatorios
          falhou=0
          for rodada in $(seq 1 10); do
            echo "::group::Rodada $rodada de 10"
            echo "Iniciada em $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            python -m pytest -v --junitxml="relatorios/testes-${rodada}.xml" || falhou=1
            echo "::endgroup::"

            if [ "$rodada" -lt 10 ]; then
              sleep 30
            fi
          done
          exit "$falhou"

      - name: Guardar relatorios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-dos-testes
          path: relatorios/*.xml
          if-no-files-found: ignore
